<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="brand" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0c87eb"/>
      <stop offset="100%" stop-color="#6366f1"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="675" fill="url(#bg)"/>

  <!-- Window Frame -->
  <rect x="60" y="40" width="1080" height="595" rx="16" fill="#f8fafc" stroke="#334155" stroke-width="2"/>
  
  <!-- Header Bar -->
  <rect x="60" y="40" width="1080" height="55" rx="16" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
  <circle cx="95" cy="68" r="6" fill="#ef4444"/>
  <circle cx="115" cy="68" r="6" fill="#f59e0b"/>
  <circle cx="135" cy="68" r="6" fill="#10b981"/>
  <text x="165" y="73" font-family="-apple-system, sans-serif" font-size="14" font-weight="700" fill="#0f172a">Scalezix AI Content Quality &amp; Factuality Checker</text>
  <rect x="940" y="55" width="170" height="26" rx="6" fill="#f0f7ff" stroke="#bae0fd" stroke-width="1"/>
  <text x="955" y="72" font-family="-apple-system, sans-serif" font-size="11" font-weight="600" fill="#0354a2">● Google Gemini 3.5 / 3.8</text>

  <!-- Scorecard Section -->
  <g transform="translate(90, 115)">
    <!-- Score 1 -->
    <rect x="0" y="0" width="240" height="95" rx="12" fill="#ecfdf5" stroke="#a7f3d0" stroke-width="1"/>
    <text x="20" y="28" font-family="-apple-system, sans-serif" font-size="11" font-weight="700" fill="#065f46">QUALITY SCORE</text>
    <text x="20" y="65" font-family="-apple-system, sans-serif" font-size="32" font-weight="800" fill="#047857">88</text>
    <text x="65" y="65" font-family="-apple-system, sans-serif" font-size="14" font-weight="500" fill="#065f46">/ 100</text>
    <text x="20" y="82" font-family="-apple-system, sans-serif" font-size="10" font-weight="500" fill="#059669">Editorial Polish: Strong</text>

    <!-- Score 2 -->
    <rect x="260" y="0" width="240" height="95" rx="12" fill="#fef2f2" stroke="#fecaca" stroke-width="1"/>
    <text x="280" y="28" font-family="-apple-system, sans-serif" font-size="11" font-weight="700" fill="#991b1b">FACTUALITY SCORE</text>
    <text x="280" y="65" font-family="-apple-system, sans-serif" font-size="32" font-weight="800" fill="#dc2626">65</text>
    <text x="325" y="65" font-family="-apple-system, sans-serif" font-size="14" font-weight="500" fill="#991b1b">/ 100</text>
    <text x="280" y="82" font-family="-apple-system, sans-serif" font-size="10" font-weight="500" fill="#b91c1c">Contains Clashing Claims</text>

    <!-- Score 3 -->
    <rect x="520" y="0" width="240" height="95" rx="12" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
    <text x="540" y="28" font-family="-apple-system, sans-serif" font-size="11" font-weight="700" fill="#475569">PRIORITY FINDINGS</text>
    <text x="540" y="65" font-family="-apple-system, sans-serif" font-size="32" font-weight="800" fill="#0f172a">5</text>
    <text x="570" y="65" font-family="-apple-system, sans-serif" font-size="14" font-weight="500" fill="#64748b">issues</text>
    <rect x="540" y="73" width="55" height="16" rx="4" fill="#fee2e2"/>
    <text x="548" y="84" font-family="-apple-system, sans-serif" font-size="9" font-weight="700" fill="#991b1b">2 High</text>
    <rect x="605" y="73" width="55" height="16" rx="4" fill="#fef3c7"/>
    <text x="613" y="84" font-family="-apple-system, sans-serif" font-size="9" font-weight="700" fill="#92400e">2 Med</text>
    <rect x="670" y="73" width="55" height="16" rx="4" fill="#e0f2fe"/>
    <text x="678" y="84" font-family="-apple-system, sans-serif" font-size="9" font-weight="700" fill="#0369a1">1 Low</text>

    <!-- Score 4 -->
    <rect x="780" y="0" width="240" height="95" rx="12" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
    <text x="800" y="28" font-family="-apple-system, sans-serif" font-size="11" font-weight="700" fill="#475569">EVIDENCE GROUNDING</text>
    <text x="800" y="65" font-family="-apple-system, sans-serif" font-size="32" font-weight="800" fill="#0f172a">4</text>
    <text x="830" y="65" font-family="-apple-system, sans-serif" font-size="14" font-weight="500" fill="#64748b">claims</text>
    <rect x="800" y="73" width="80" height="16" rx="4" fill="#d1fae5"/>
    <text x="808" y="84" font-family="-apple-system, sans-serif" font-size="9" font-weight="700" fill="#065f46">1 Supported</text>
    <rect x="890" y="73" width="70" height="16" rx="4" fill="#fee2e2"/>
    <text x="898" y="84" font-family="-apple-system, sans-serif" font-size="9" font-weight="700" fill="#991b1b">1 Clashes</text>
  </g>

  <!-- Findings Cards Mock -->
  <g transform="translate(90, 230)">
    <!-- Finding 1 -->
    <rect x="0" y="0" width="1020" height="110" rx="10" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
    <rect x="0" y="0" width="6" height="110" rx="3" fill="#ef4444"/>
    <rect x="25" y="15" width="45" height="18" rx="4" fill="#fee2e2"/>
    <text x="33" y="27" font-family="-apple-system, sans-serif" font-size="10" font-weight="700" fill="#991b1b">HIGH</text>
    <text x="80" y="28" font-family="-apple-system, sans-serif" font-size="12" font-weight="700" fill="#0f172a">Factuality &amp; Evidence</text>
    <rect x="220" y="15" width="80" height="18" rx="4" fill="#f3e8ff"/>
    <text x="228" y="27" font-family="-apple-system, sans-serif" font-size="10" font-weight="600" fill="#7e22ce">Gemini AI</text>
    <rect x="310" y="15" width="145" height="18" rx="4" fill="#ffe4e6"/>
    <text x="318" y="27" font-family="-apple-system, sans-serif" font-size="10" font-weight="600" fill="#be123c">Potentially Contradicted</text>
    
    <text x="25" y="55" font-family="-apple-system, sans-serif" font-size="11" font-style="italic" fill="#475569">"Global SaaS spending reached $850 billion in 2024 as enterprises accelerate migration..."</text>
    <text x="25" y="78" font-family="-apple-system, sans-serif" font-size="11" font-weight="600" fill="#0f172a">Issue: <tspan font-weight="400" fill="#475569">Stated figure contradicts supplied Gartner reference citing $247.2B worldwide SaaS spending.</tspan></text>
    <text x="25" y="96" font-family="-apple-system, sans-serif" font-size="11" font-weight="600" fill="#047857">Action: <tspan font-weight="400" fill="#065f46">Update figure to $247.2B as verified by Gartner Market Databook (Q4 2024).</tspan></text>

    <!-- Finding 2 -->
    <rect x="0" y="125" width="1020" height="100" rx="10" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
    <rect x="0" y="125" width="6" height="100" rx="3" fill="#f59e0b"/>
    <rect x="25" y="140" width="55" height="18" rx="4" fill="#fef3c7"/>
    <text x="33" y="152" font-family="-apple-system, sans-serif" font-size="10" font-weight="700" fill="#92400e">MEDIUM</text>
    <text x="90" y="153" font-family="-apple-system, sans-serif" font-size="12" font-weight="700" fill="#0f172a">Repetition &amp; Redundancy</text>
    <rect x="260" y="140" width="115" height="18" rx="4" fill="#ecfeff"/>
    <text x="268" y="152" font-family="-apple-system, sans-serif" font-size="10" font-weight="600" fill="#0e7490">Deterministic Rule</text>

    <text x="25" y="180" font-family="-apple-system, sans-serif" font-size="11" font-style="italic" fill="#475569">"'in the digital realm' (repeated 3 times)"</text>
    <text x="25" y="202" font-family="-apple-system, sans-serif" font-size="11" font-weight="600" fill="#0f172a">Issue: <tspan font-weight="400" fill="#475569">The 4-word phrase 'in the digital realm' appears 3 times across consecutive sentences.</tspan></text>
    <text x="25" y="217" font-family="-apple-system, sans-serif" font-size="11" font-weight="600" fill="#047857">Action: <tspan font-weight="400" fill="#065f46">Vary opening phrasing with synonyms to maintain dynamic reader rhythm.</tspan></text>

    <!-- Finding 3 -->
    <rect x="0" y="240" width="1020" height="85" rx="10" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
    <rect x="0" y="240" width="6" height="85" rx="3" fill="#3b82f6"/>
    <rect x="25" y="255" width="40" height="18" rx="4" fill="#dbeafe"/>
    <text x="33" y="267" font-family="-apple-system, sans-serif" font-size="10" font-weight="700" fill="#1e40af">LOW</text>
    <text x="75" y="268" font-family="-apple-system, sans-serif" font-size="12" font-weight="700" fill="#0f172a">Unclear &amp; Run-on Sentences</text>
    <rect x="260" y="255" width="115" height="18" rx="4" fill="#ecfeff"/>
    <text x="268" y="267" font-family="-apple-system, sans-serif" font-size="10" font-weight="600" fill="#0e7490">Deterministic Rule</text>
    <text x="25" y="295" font-family="-apple-system, sans-serif" font-size="11" font-style="italic" fill="#475569">"When enterprises decide to overhaul their legacy software distribution pipelines while simultaneously coordinating..."</text>
    <text x="25" y="315" font-family="-apple-system, sans-serif" font-size="11" font-weight="600" fill="#047857">Action: <tspan font-weight="400" fill="#065f46">Split 48-word run-on sentence into two focused, punchy sentences.</tspan></text>
  </g>

  <!-- Bottom Badges -->
  <g transform="translate(90, 585)">
    <text x="0" y="15" font-family="-apple-system, sans-serif" font-size="11" font-weight="500" fill="#64748b">Export Reports: Markdown (.md) | JSON (.json) | Live Clipboard Synthesis</text>
    <text x="750" y="15" font-family="-apple-system, sans-serif" font-size="11" font-weight="600" fill="#0284c7">Full Vercel &amp; Next.js 15 Production Ready</text>
  </g>
</svg>
